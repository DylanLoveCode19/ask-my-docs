# Local models are downloaded only when later milestones need them.
models:
  embedding: BAAI/bge-small-en-v1.5
  reranker: BAAI/bge-reranker-base

chunking:
  size_tokens: 512
  overlap_tokens: 64

retrieval:
  bm25_top_n: 20
  dense_top_n: 20
  fusion_top_m: 20
  top_k: 5
  rrf_k: 60

# USD per 1M tokens. Set these for the chosen provider before cost evaluation.
# LLM_PRICE_INPUT_PER_M / LLM_PRICE_OUTPUT_PER_M in .env override these defaults.
llm_price_input_per_m: 0.0
llm_price_output_per_m: 0.0
